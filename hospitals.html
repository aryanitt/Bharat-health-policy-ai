<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Health Policy Genius | Hospitals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero-section" style="padding: 40px 20px; background: white;">
        <div class="hero-content">
            <h1>Find Hospitals</h1>
            <p>Locate PM-JAY empaneled hospitals near you.</p>
        </div>
    </section>

    <div class="features-section">
        <div
            style="max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">

            <!-- Online Search Card -->
            <div class="feature-card" style="text-align: center; padding: 40px;">
                <div class="icon-box"><ion-icon name="globe-outline"></ion-icon></div>
                <h3>Search Online</h3>
                <p style="margin-bottom: 24px;">Find empaneled hospitals by State, District, and Specialty on the
                    official portal.</p>
                <a href="https://hospitals.pmjay.gov.in/Search/" target="_blank" class="btn btn-primary"
                    style="width: 100%; justify-content: center;">
                    Open Search Portal <ion-icon name="open-outline" style="margin-left: 8px;"></ion-icon>
                </a>
            </div>

            <!-- Helpline Card -->
            <div class="feature-card" style="text-align: center; padding: 40px;">
                <div class="icon-box"><ion-icon name="call-outline"></ion-icon></div>
                <h3>Call Helpline</h3>
                <p style="margin-bottom: 24px;">Need help finding a hospital? Call the National Toll-Free Helpline.</p>
                <a href="tel:14555" class="btn btn-secondary"
                    style="width: 100%; justify-content: center; border-color: var(--primary); color: var(--primary);">
                    <ion-icon name="call" style="margin-right: 8px;"></ion-icon> Call 14555
                </a>
            </div>

        </div>
    </div>

    <script src="js/nav.js"></script>
</body>

</html>
